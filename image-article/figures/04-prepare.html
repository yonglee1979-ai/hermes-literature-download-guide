<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="../style.css"><body><article class="card "><div class="eyebrow"><span>HERMES · 文献下载图解</span><span>04 / 20</span></div><h1>开始前，<br>先准备好这四样</h1><div class="subtitle">下面用电脑命令行 CLI 举例</div><div class="content"><div class="talk"><div class="robot" style="--s:310px;background-position:100% 0%"></div><div class="bubble">命令在电脑终端输入；<br>找论文的任务，在 Hermes 对话区发送。<br>两处不要弄混。</div></div><div class="row"><section class="box "><h3>① 电脑</h3><p>macOS / Linux<br>Windows 或 WSL2</p></section><section class="box "><h3>② 模型入口</h3><p>可用的服务商账户<br>与对应登录方式</p></section></div><div class="row"><section class="box "><h3>③ 网络与权限</h3><p>能访问模型服务<br>及目标文献网站</p></section><section class="box "><h3>④ 工作文件夹</h3><p>有写入权限<br>用于保存练习文件</p></section></div><aside>需要操作的输入区只有两个：<br><b>电脑终端</b>输入命令；<b>Hermes 对话区</b>输入任务。</aside><p>模型与工具可能产生费用，按你选择的服务规则执行。</p></div><div class="footer">官方同时提供其他安装入口；本文统一演示 CLI</div></article></body></html>
