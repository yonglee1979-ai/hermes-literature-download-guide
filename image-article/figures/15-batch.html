<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="../style.css"><body><article class="card "><div class="eyebrow"><span>HERMES · 文献下载图解</span><span>15 / 20</span></div><h1>批量任务，<br>先跑一个“小队”</h1><div class="subtitle">第一批最多 5 篇，逐篇记录状态</div><div class="content"><div class="talk"><div class="robot" style="--s:310px;background-position:50% 100%"></div><div class="bubble">我每处理一篇就写清单。<br>中途停下，也能从待办继续。</div></div><div class="batch"><span>①</span><span>②</span><span>③</span><span>④</span><span>⑤</span></div><div class="step"><b class="num">A</b><div><h3>读取已核对的清单</h3><p>逐篇找入口、下载、核验。<br>按网站要求限速，设置超时与重试上限。</p></div></div><div class="step"><b class="num">B</b><div><h3>一篇完成，立即登记</h3><p>成功、缺权限、未找到、核验失败，<br>分别标注；其他格式单独统计。</p></div></div><div class="step"><b class="num">C</b><div><h3>恢复任务，只做待办</h3><p>已核验文件跳过，不重复覆盖。</p></div></div><section class="box "><h3>让报告说清楚</h3><p>PDF 核验通过：__ 篇<br>其他格式：__ 篇｜待处理：__ 篇</p></section></div><div class="footer">批量流程与报告占位示意 · 下划线由实际结果填写</div></article></body></html>
