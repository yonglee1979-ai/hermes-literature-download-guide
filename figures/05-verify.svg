<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040"><rect x="0" y="0" width="960" height="1040" rx="0" fill="#F3F7F8"/><rect x="42" y="35" width="10" height="56" rx="4" fill="#167F85"/><text x="72" y="39" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="43">PDF 下载完成，要核验这四项</text><text x="44" y="112" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">扩展名正确，还不足以证明文件可靠</text><rect x="42" y="177" width="426" height="225" rx="22" fill="#FFFFFF"/><text x="65" y="199" dominant-baseline="text-before-edge" fill="#167F85" font-family="Arial" font-size="34">01</text><text x="65" y="249" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="36">格式正确</text><text x="65" y="302" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">可以正常解析</text><text x="65" y="348" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">并打开文件</text><rect x="492" y="177" width="426" height="225" rx="22" fill="#FFFFFF"/><text x="515" y="199" dominant-baseline="text-before-edge" fill="#167F85" font-family="Arial" font-size="34">02</text><text x="515" y="249" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="36">身份匹配</text><text x="515" y="302" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">首页题名</text><text x="515" y="348" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">与作者信息相符</text><rect x="42" y="427" width="426" height="225" rx="22" fill="#FFFFFF"/><text x="65" y="449" dominant-baseline="text-before-edge" fill="#167F85" font-family="Arial" font-size="34">03</text><text x="65" y="499" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="36">确实是正文</text><text x="65" y="552" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">论文正文与</text><text x="65" y="598" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">补充材料分开</text><rect x="492" y="427" width="426" height="225" rx="22" fill="#FFFFFF"/><text x="515" y="449" dominant-baseline="text-before-edge" fill="#167F85" font-family="Arial" font-size="34">04</text><text x="515" y="499" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="36">版本可追溯</text><text x="515" y="552" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">记录发表版、手稿</text><text x="515" y="598" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">或 arXiv 版本</text><rect x="42" y="696" width="876" height="68" rx="18" fill="#D9EAEC"/><text x="66" y="714" dominant-baseline="text-before-edge" fill="#247461" font-family="Heiti SC, STHeiti, sans-serif" font-size="34">通过核验 → 标记为 PDF 已核验</text><rect x="42" y="785" width="876" height="68" rx="18" fill="#FFF2DF"/><text x="66" y="803" dominant-baseline="text-before-edge" fill="#D78326" font-family="Heiti SC, STHeiti, sans-serif" font-size="32">暂时无法确认 → 保留文件，人工核对</text><rect x="42" y="889" width="876" height="65" rx="18" fill="#102C45"/><text x="66" y="906" dominant-baseline="text-before-edge" fill="#FFFFFF" font-family="Heiti SC, STHeiti, sans-serif" font-size="36">下载成功 ≠ 全文已审阅</text><text x="44" y="986" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="27">核验清单 · 文字不可读时，检查解析依赖或 OCR</text></svg>