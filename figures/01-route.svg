<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1110" viewBox="0 0 960 1110"><rect x="0" y="0" width="960" height="1110" rx="0" fill="#F3F7F8"/><rect x="42" y="35" width="10" height="56" rx="4" fill="#167F85"/><text x="72" y="39" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="43">第一次下载，跟着这条路线走</text><text x="44" y="112" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">先跑通 1 篇，再扩展到 10–20 篇</text><rect x="42" y="177" width="876" height="110" rx="22" fill="#FFFFFF"/><rect x="62" y="202" width="62" height="62" rx="31" fill="#167F85"/><text x="71" y="213" dominant-baseline="text-before-edge" fill="#FFFFFF" font-family="Arial" font-size="31">01</text><text x="151" y="196" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="37">安装 Hermes</text><text x="151" y="241" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">下载官方安装包，或使用官方安装脚本</text><path d="M 480 291 V 313 M 471 307 L 480 317 L 489 307" stroke="#167F85" stroke-width="4" fill="none"/><rect x="42" y="310" width="876" height="110" rx="22" fill="#FFFFFF"/><rect x="62" y="335" width="62" height="62" rx="31" fill="#167F85"/><text x="71" y="346" dominant-baseline="text-before-edge" fill="#FFFFFF" font-family="Arial" font-size="31">02</text><text x="151" y="329" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="37">连接模型</text><text x="151" y="374" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">完成授权，确认能正常对话</text><path d="M 480 424 V 446 M 471 440 L 480 450 L 489 440" stroke="#167F85" stroke-width="4" fill="none"/><rect x="42" y="443" width="876" height="110" rx="22" fill="#FFFFFF"/><rect x="62" y="468" width="62" height="62" rx="31" fill="#167F85"/><text x="71" y="479" dominant-baseline="text-before-edge" fill="#FFFFFF" font-family="Arial" font-size="31">03</text><text x="151" y="462" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="37">检查工具</text><text x="151" y="507" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">确认能联网、下载和保存文件</text><path d="M 480 557 V 579 M 471 573 L 480 583 L 489 573" stroke="#167F85" stroke-width="4" fill="none"/><rect x="42" y="576" width="876" height="110" rx="22" fill="#FFFFFF"/><rect x="62" y="601" width="62" height="62" rx="31" fill="#167F85"/><text x="71" y="612" dominant-baseline="text-before-edge" fill="#FFFFFF" font-family="Arial" font-size="31">04</text><text x="151" y="595" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="37">提交任务</text><text x="151" y="640" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">给出论文题名或编号，并明确保存目录</text><path d="M 480 690 V 712 M 471 706 L 480 716 L 489 706" stroke="#167F85" stroke-width="4" fill="none"/><rect x="42" y="709" width="876" height="110" rx="22" fill="#FFFFFF"/><rect x="62" y="734" width="62" height="62" rx="31" fill="#167F85"/><text x="71" y="745" dominant-baseline="text-before-edge" fill="#FFFFFF" font-family="Arial" font-size="31">05</text><text x="151" y="728" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="37">核验 PDF</text><text x="151" y="773" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">打开文件，核对身份、正文和版本</text><path d="M 480 823 V 845 M 471 839 L 480 849 L 489 839" stroke="#167F85" stroke-width="4" fill="none"/><rect x="42" y="842" width="876" height="110" rx="22" fill="#FFFFFF"/><rect x="62" y="867" width="62" height="62" rx="31" fill="#167F85"/><text x="71" y="878" dominant-baseline="text-before-edge" fill="#FFFFFF" font-family="Arial" font-size="31">06</text><text x="151" y="861" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="37">整理归档</text><text x="151" y="906" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">保存 PDF、文献清单和未完成清单</text><rect x="42" y="993" width="876" height="56" rx="14" fill="#D9EAEC"/><text x="64" y="1004" dominant-baseline="text-before-edge" fill="#167F85" font-family="Heiti SC, STHeiti, sans-serif" font-size="31">成功标准：文件能打开，来源能追溯</text><text x="44" y="1056" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="27">流程示意 · 各步骤是否完成，以实际结果为准</text></svg>