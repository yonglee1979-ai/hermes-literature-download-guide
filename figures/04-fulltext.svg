<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120"><rect x="0" y="0" width="960" height="1120" rx="0" fill="#F3F7F8"/><rect x="42" y="35" width="10" height="56" rx="4" fill="#167F85"/><text x="72" y="39" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="43">找到了论文，接着寻找全文</text><text x="44" y="112" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">先核对身份，再决定获取路径</text><rect x="42" y="177" width="876" height="200" rx="22" fill="#FFFFFF"/><text x="68" y="200" dominant-baseline="text-before-edge" fill="#167F85" font-family="Arial" font-size="37">01</text><text x="140" y="199" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="37">确认是同一篇论文</text><text x="68" y="260" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="33">核对题名、作者、年份和标识符</text><text x="68" y="314" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="31">DOI / PMID / arXiv ID</text><path d="M 480 385 V 407 M 471 401 L 480 411 L 489 401" stroke="#167F85" stroke-width="4" fill="none"/><rect x="42" y="417" width="876" height="200" rx="22" fill="#FFFFFF"/><text x="68" y="440" dominant-baseline="text-before-edge" fill="#167F85" font-family="Arial" font-size="37">02</text><text x="140" y="439" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="37">检查可获取的开放版本</text><text x="68" y="500" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="33">查看期刊官网、PMC 和机构仓储</text><text x="68" y="554" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="31">PMC 自动批量获取须走官方服务</text><path d="M 480 625 V 647 M 471 641 L 480 651 L 489 641" stroke="#167F85" stroke-width="4" fill="none"/><rect x="42" y="657" width="876" height="200" rx="22" fill="#FFFFFF"/><text x="68" y="680" dominant-baseline="text-before-edge" fill="#167F85" font-family="Arial" font-size="37">03</text><text x="140" y="679" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="37">需要权限时，检查机构入口</text><text x="68" y="740" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="33">使用自己的医院或学校图书馆</text><text x="68" y="794" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="31">暂时未取得全文，也要保留题录</text><rect x="42" y="901" width="426" height="110" rx="20" fill="#D9EAEC"/><text x="64" y="921" dominant-baseline="text-before-edge" fill="#167F85" font-family="Heiti SC, STHeiti, sans-serif" font-size="35">有全文</text><text x="64" y="969" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">保存，并核验</text><rect x="492" y="901" width="426" height="110" rx="20" fill="#FFF2DF"/><text x="514" y="921" dominant-baseline="text-before-edge" fill="#D78326" font-family="Heiti SC, STHeiti, sans-serif" font-size="35">暂时未取得</text><text x="514" y="969" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="30">保留题录与原因</text><text x="44" y="1066" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="27">获取路径示意 · 许可与格式以实际来源为准</text></svg>