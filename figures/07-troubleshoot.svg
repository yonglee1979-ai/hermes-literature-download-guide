<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1030" viewBox="0 0 960 1030"><rect x="0" y="0" width="960" height="1030" rx="0" fill="#F3F7F8"/><rect x="42" y="35" width="10" height="56" rx="4" fill="#167F85"/><text x="72" y="39" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="43">任务卡住，按顺序排查</text><text x="44" y="112" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">先找出问题发生在哪一步，再继续</text><rect x="42" y="177" width="876" height="132" rx="20" fill="#FFFFFF"/><text x="68" y="197" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="36">不能搜索</text><text x="68" y="255" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="31">检查工具是否启用，以及服务配置</text><rect x="42" y="334" width="876" height="132" rx="20" fill="#FFFFFF"/><text x="68" y="354" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="36">有链接，没有文件</text><text x="68" y="412" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="31">检查下载能力、保存目录和权限</text><rect x="42" y="491" width="876" height="132" rx="20" fill="#FFFFFF"/><text x="68" y="511" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="36">PDF 无法打开</text><text x="68" y="569" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="31">排除登录页、错误页和残缺文件</text><rect x="42" y="648" width="876" height="132" rx="20" fill="#FFFFFF"/><text x="68" y="668" dominant-baseline="text-before-edge" fill="#102C45" font-family="Heiti SC, STHeiti, sans-serif" font-size="36">下载到一半中断</text><text x="68" y="726" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="31">根据清单续传，跳过已核验文件</text><rect x="42" y="843" width="876" height="99" rx="20" fill="#102C45"/><text x="65" y="863" dominant-baseline="text-before-edge" fill="#B3E8DE" font-family="Arial" font-size="42">hermes doctor</text><text x="447" y="884" dominant-baseline="text-before-edge" fill="#FFFFFF" font-family="Heiti SC, STHeiti, sans-serif" font-size="29">配置问题先看诊断</text><text x="44" y="976" dominant-baseline="text-before-edge" fill="#547080" font-family="Heiti SC, STHeiti, sans-serif" font-size="27">排查顺序示意 · 遇到限流，遵守来源规则再重试</text></svg>